        var horizontal = Math.max(this.baseSize.x, this.baseSize.z);
        var size = Math.max(12, Math.ceil(horizontal * 2.2));
        if (size % 2 !== 0) size += 1;
        this.grid.setAttribute('metric-grid', {
          size: size,
          divisions: Math.min(160, size),
          opacity: 0.15
        });
        this.grid.object3D.position.set(0, 0, 0);
        this.grid.object3D.visible = this.modeType === 'vr';
      },
      onARSelect: function () {
        if (this.modeType !== 'mr' || !this.ready || this.placed || !this.reticle) return;
        this.placeAtReticle();
      },
      placeAtReticle: function () {
        this.reticle.object3D.getWorldPosition(this.worldPosition);
        var parent = this.pivot.object3D.parent;
        if (parent) parent.worldToLocal(this.worldPosition);

        this.pivot.object3D.position.copy(this.worldPosition);
        this.pivot.object3D.rotation.set(0, 0, 0);
        this.pivot.object3D.scale.setScalar(this.scalePercent / 100);
        this.pivot.object3D.visible = true;
        this.placed = true;

        this.el.setAttribute('ar-hit-test', 'enabled', false);
        this.reticle.object3D.visible = false;
        this.updateInfo();
        this.updateModeUI();
        this.refreshRaycaster();
      },
      resetPlacement: function () {
        if (this.modeType !== 'mr' || !this.ready) return;
        this.placed = false;
        this.grabMoving = false;
        this.twoGripRotating = false;
        this.grips.left = false;
        this.grips.right = false;
        this.pivot.object3D.visible = false;
        if (this.info) this.info.object3D.visible = false;
        this.getMeasurement().clear();
        this.getMeasurement().setEnabled(false);
        var selection = this.getSelection();
        if (selection) {
          selection.showAll();
          selection.clearSelection();
          selection.setEnabled(false);
        }
        var annotation = this.getAnnotation();
        if (annotation) annotation.setEnabled(false);
        this.interactionMode = 'move';
        this.setScalePanelVisible(false);
        this.el.setAttribute('ar-hit-test', 'enabled', true);
        this.updateModeUI();
      },
      onScaleRequest: function (event) {
        var value = event.detail && Number(event.detail.percent);
        if (Number.isFinite(value)) this.setScalePercent(value);
      },
      setScalePercent: function (percent, silent) {
        if (this.modeType !== 'mr') return;
        this.scalePercent = Math.round(MOJA.clamp(Number(percent) || 100, 10, 500));
        if (this.pivot) this.pivot.object3D.scale.setScalar(this.scalePercent / 100);
        this.updateScalePanel();
        if (this.ready && this.placed) this.updateInfo();
        try {
          window.localStorage.setItem('moja-ck-207-74-5000_vr-mr-scale', String(this.scalePercent));
        } catch (error) {}
        if (!silent) {
          window.dispatchEvent(new CustomEvent('moja-scale-changed', {detail: {percent: this.scalePercent}}));
        }
      },
      updateScalePanel: function () {
        if (this.scaleValueText) {
          var scale = this.scalePercent / 100;
          this.scaleValueText.setAttribute('value', this.scalePercent + '%  •  ' + MOJA.formatScaleRatio(scale));
        }
        if (this.scaleKnob) {
          var clamped = MOJA.clamp(this.scalePercent, 10, 300);
          var normalized = (clamped - 10) / 290;
          this.scaleKnob.object3D.position.x = (normalized - 0.5) * 0.42;
        }
      },
      setScalePanelVisible: function (visible) {
        this.scalePanelVisible = Boolean(visible) && this.modeType === 'mr' && this.placed && this.interactionMode === 'move';
        if (this.scalePanel) this.scalePanel.object3D.visible = this.scalePanelVisible;
        this.setScalePanelInteractive(this.scalePanelVisible);
        this.refreshRaycaster();
      },
      setScalePanelInteractive: function (active) {
        if (!this.scalePanel) return;
        this.scalePanel.querySelectorAll('.scale-ui').forEach(function (control) {
          if (active) control.classList.add('ray-target');
          else control.classList.remove('ray-target');
        });
      },
      updateInfo: function () {
        if (!this.ready || !this.placed || !this.info || !this.infoText) {
          if (this.info) this.info.object3D.visible = false;
          return;
        }
        var scale = this.modeType === 'mr' ? this.scalePercent / 100 : 1;
        var x = this.baseSize.x * scale;
        var z = this.baseSize.z * scale;
        var y = this.baseSize.y * scale;
        var text = 'SKALA ' + Math.round(scale * 100) + '%  •  ' + MOJA.formatScaleRatio(scale) + '  •  ' +
          MOJA.formatMetres(x) + ' × ' + MOJA.formatMetres(z) + ' × ' + MOJA.formatMetres(y) + ' m';
        this.infoText.setAttribute('value', text);
        this.pivot.object3D.getWorldPosition(this.worldPosition);
        this.worldPosition.y += y + Math.max(0.10, Math.min(0.35, y * 0.045));
        this.info.object3D.position.copy(this.worldPosition);
        var infoScale = MOJA.clamp(Math.max(x, y, z) * 0.052, 0.24, 0.62);
        this.info.object3D.scale.setScalar(infoScale);
        this.info.object3D.visible = true;
      },
      cycleMode: function () {
        if (!this.ready || (this.modeType === 'mr' && !this.placed)) return;
        var selection = this.getSelection();
        var measurement = this.getMeasurement();
        var annotation = this.getAnnotation();

        if (this.modeType === 'vr') {
          if (this.interactionMode === 'nav') this.interactionMode = 'measure';
          else if (this.interactionMode === 'measure') this.interactionMode = 'select';
          else if (this.interactionMode === 'select') this.interactionMode = 'annotate';
          else this.interactionMode = 'nav';
        } else {
          if (this.interactionMode === 'move') this.interactionMode = 'measure';
          else if (this.interactionMode === 'measure') this.interactionMode = 'select';
          else if (this.interactionMode === 'select') this.interactionMode = 'annotate';
          else this.interactionMode = 'move';
        }

        measurement.setEnabled(this.interactionMode === 'measure');
        if (selection) selection.setEnabled(this.interactionMode === 'select');
        if (annotation) annotation.setEnabled(this.interactionMode === 'annotate');

        if (this.interactionMode !== 'move') this.setScalePanelVisible(false);
        if (this.teleportMarker) this.teleportMarker.object3D.visible = false;
        this.updateModeUI();
        this.updateRayColor();
      },
      handleY: function () {
        if (!this.ready) return;
        if (this.interactionMode === 'measure') {
          this.getMeasurement().clear();
          return;
        }
        if (this.interactionMode === 'select') {
          var selection = this.getSelection();
          if (selection) selection.togglePanel();
          return;
        }
        if (this.interactionMode === 'annotate') {
          var annotation = this.getAnnotation();
          if (annotation) annotation.togglePanel();
          return;
        }
        if (this.modeType === 'mr' && this.interactionMode === 'move') {
          this.setScalePanelVisible(!this.scalePanelVisible);
        }
      },
      updateModeUI: function () {
        if (!this.modeText) return;
        if (this.modeType === 'mr' && !this.placed) {
          this.modeText.setAttribute('value', 'USTAWIANIE  •  TRIGGER: POSTAW MODEL');
          this.modeText.setAttribute('color', '#D1FAE5');
          return;
        }
        if (this.interactionMode === 'measure') {
          this.modeText.setAttribute('value', 'POMIAR  •  SNAP AUTO  •  TRIGGER: PUNKT  •  Y: WYCZYŚĆ  •  X: KOMPONENTY');
          this.modeText.setAttribute('color', '#FBBF24');
        } else if (this.interactionMode === 'select') {
          this.modeText.setAttribute('value', 'DRZEWO  •  TRIGGER: WYBIERZ  •  Y: PANEL  •  PRAWY JOYSTICK: PRZEWIJAJ  •  +/−: ROZWIŃ');
          this.modeText.setAttribute('color', '#C4B5FD');
        } else if (this.interactionMode === 'annotate') {
          this.modeText.setAttribute('value', 'ADNOTACJE 3D  •  RYSUJ: TRZYMAJ TRIGGER  •  TEKST: PUŚĆ TRIGGER W PUNKCIE WSKAŹNIKA  •  Y: PANEL');
          this.modeText.setAttribute('color', '#F9A8D4');
        } else if (this.modeType === 'mr') {
          this.modeText.setAttribute(
            'value',
            this.freeGrab3D
              ? 'MR FREE GRAB 3D  •  1 GRIP: PRZESUŃ + OBRÓĆ  •  2 GRIPY: OBRÓT Y  •  Y: SKALA'
              : 'MR  •  L: PRZESUŃ  •  PRAWY GRIP: PRZESUŃ  •  2 GRIPY: OBRÓT Y  •  Y: SKALA'
          );
          this.modeText.setAttribute('color', '#D1FAE5');
        } else {
          this.modeText.setAttribute('value', 'NAWIGACJA  •  L: RUCH  •  R: OBRÓT  •  B: GÓRA  •  A: DÓŁ  •  TRIGGER: TELEPORT');
          this.modeText.setAttribute('color', '#E0F2FE');
        }
      },
      updateRayColor: function () {
        if (!this.right) return;
        var ray = this.right.components['trigger-ray'];
        if (!ray) return;
        if (this.interactionMode === 'measure') ray.setColor('#F59E0B');
        else if (this.interactionMode === 'select') ray.setColor('#A78BFA');
        else if (this.interactionMode === 'annotate') ray.setColor('#F472B6');
        else ray.setColor('#38BDF8');
      },
      onRaySelect: function (event) {
        if (!this.ready) return;
        var intersection = event.detail && event.detail.intersection;
        if (!intersection) {
          if (this.interactionMode === 'measure' && event.detail && event.detail.ray) {
            this.getMeasurement().addIntersection(null, event.detail.ray, []);
          }
          return;
        }
        var targetEl = MOJA.getInteractiveEl(intersection);
        if (targetEl && targetEl.classList && targetEl.classList.contains('ui-click')) {
          targetEl.emit('click', {intersection: intersection}, false);
          return;
        }
        if (this.modeType === 'mr' && !this.placed) return;
        if (this.interactionMode === 'measure') {
          var allIntersections = event.detail && Array.isArray(event.detail.intersections)
            ? event.detail.intersections
            : [intersection];
          var measureIntersections = allIntersections.filter(function (candidate) {
            var candidateEl = MOJA.getInteractiveEl(candidate);
            return candidateEl && candidateEl.classList && candidateEl.classList.contains('measure-target');
          });
          this.getMeasurement().addIntersection(
            measureIntersections.length ? measureIntersections[0] : null,
            event.detail && event.detail.ray,
            measureIntersections
          );
          return;
        }
        if (this.interactionMode === 'select') {
          var selection = this.getSelection();
          if (selection) selection.selectIntersection(intersection);
          return;
        }
        if (this.interactionMode === 'annotate') return;
        if (this.modeType === 'vr' && this.isValidTeleport(intersection)) this.teleportTo(intersection.point);
      },
      isValidTeleport: function (intersection) {
        var targetEl = MOJA.getInteractiveEl(intersection);
        if (!targetEl || !targetEl.classList.contains('teleportable')) return false;
        return MOJA.intersectionNormalY(intersection) >= 0.48;
      },
      teleportTo: function (point) {
        if (!this.rig || !this.camera || !point) return;
        this.camera.object3D.getWorldPosition(this.cameraWorldBefore);
        this.rig.object3D.position.x += point.x - this.cameraWorldBefore.x;
        this.rig.object3D.position.z += point.z - this.cameraWorldBefore.z;
        this.rig.object3D.position.y = point.y;
        this.rig.object3D.updateMatrixWorld(true);
      },
      updateTeleportMarker: function () {
        if (this.modeType !== 'vr' || this.interactionMode !== 'nav' || !this.teleportMarker || !this.right) {
          if (this.teleportMarker) this.teleportMarker.object3D.visible = false;
          return;
        }
        var triggerRay = this.right.components['trigger-ray'];
        if (!triggerRay || !triggerRay.active || !triggerRay.currentIntersection) {
          this.teleportMarker.object3D.visible = false;
          return;
        }
        var intersection = triggerRay.currentIntersection;
        if (!this.isValidTeleport(intersection)) {
          this.teleportMarker.object3D.visible = false;
          triggerRay.setColor('#FB7185');
          return;
        }
        triggerRay.setColor('#38BDF8');
        this.teleportMarker.object3D.position.copy(intersection.point);
        this.teleportMarker.object3D.position.y += 0.018;
        this.teleportMarker.object3D.visible = true;
      },
      onUIAction: function (event) {
        var detail = event.detail || {};
        switch (detail.action) {
          case 'scale': this.setScalePercent(detail.value); break;
          case 'scale-delta': this.setScalePercent(this.scalePercent + detail.value); break;
          case 'replace': this.resetPlacement(); break;
          case 'close-scale': this.setScalePanelVisible(false); break;
          case 'free-grab-toggle': this.toggleFreeGrab3D(); break;
          case 'measure': this.cycleMode(); break;
        }
      },
      refreshRaycaster: function () {
        if (!this.right) return;
        var ray = this.right.components['trigger-ray'];
        if (ray) window.setTimeout(function () { ray.refresh(); }, 0);
      },
      setGrip: function (hand, active) {
        if (this.modeType !== 'mr' || !this.ready || !this.placed || this.interactionMode !== 'move') return;

        this.grips[hand] = active;

        if (this.grips.left && this.grips.right) {
          this.freeGrabMoving = false;
          this.beginTwoGripRotation();
          return;
        }

        this.twoGripRotating = false;

        if (this.freeGrab3D) {
          var remainingHand = this.grips.right ? 'right' : (this.grips.left ? 'left' : null);
          if (remainingHand) this.beginFreeGrab(remainingHand);
          else {
            this.freeGrabMoving = false;
            this.freeGrabHand = null;
          }
          this.grabMoving = false;
          return;
        }

        this.freeGrabMoving = false;
        this.freeGrabHand = null;

        if (this.grips.right) this.beginMoveGrab();
        else this.grabMoving = false;
      },
      controllerPositionInPivotParent: function (controller, output) {
        controller.object3D.getWorldPosition(output);
        var parent = this.pivot.object3D.parent;
        if (parent) parent.worldToLocal(output);
        return output;
      },
      controllerQuaternionInPivotParent: function (controller, output) {
        controller.object3D.getWorldQuaternion(output);
        var parent = this.pivot.object3D.parent;
        if (parent) {
          parent.getWorldQuaternion(this.parentWorldQuat);
          this.parentWorldQuatInv.copy(this.parentWorldQuat).invert();
          output.premultiply(this.parentWorldQuatInv);
        }
        return output;
      },

      updateFreeGrabButton: function () {
        if (!this.freeGrabButton || !this.freeGrabButtonText) return;
        if (this.modeType !== 'mr') {
          this.freeGrabButton.object3D.visible = false;
          return;
        }
        this.freeGrabButton.object3D.visible = true;
        this.freeGrabButton.setAttribute('color', this.freeGrab3D ? '#0F766E' : '#334155');
        this.freeGrabButtonText.setAttribute(
          'value',
          this.freeGrab3D ? 'FREE GRAB 3D: ON' : 'FREE GRAB 3D: OFF'
        );
        this.freeGrabButtonText.setAttribute('color', this.freeGrab3D ? '#CCFBF1' : '#E2E8F0');
      },

      toggleFreeGrab3D: function () {
        if (this.modeType !== 'mr') return;
        this.freeGrab3D = !this.freeGrab3D;
        this.freeGrabMoving = false;
        this.freeGrabHand = null;
        this.grabMoving = false;
        this.twoGripRotating = false;
        this.grips.left = false;
        this.grips.right = false;
        this.updateFreeGrabButton();
        this.updateModeUI();
      },

      beginFreeGrab: function (hand) {
        var controller = hand === 'left' ? this.left : this.right;
        if (!controller) return;

        this.freeGrabHand = hand;
        this.freeGrabMoving = true;
        this.grabMoving = false;
        this.twoGripRotating = false;

        this.controllerPositionInPivotParent(controller, this.freeGrabStartController);
        this.controllerQuaternionInPivotParent(controller, this.freeGrabStartControllerQuat);
        this.freeGrabStartControllerQuatInv.copy(this.freeGrabStartControllerQuat).invert();

        this.freeGrabStartModel.copy(this.pivot.object3D.position);
        this.freeGrabStartModelQuat.copy(this.pivot.object3D.quaternion);
      },

      updateFreeGrab: function () {
        if (!this.freeGrab3D || !this.freeGrabMoving || !this.freeGrabHand) return;

        var controller = this.freeGrabHand === 'left' ? this.left : this.right;
        if (!controller || !this.grips[this.freeGrabHand]) {
          this.freeGrabMoving = false;
          this.freeGrabHand = null;
          return;
        }

        this.controllerPositionInPivotParent(controller, this.freeGrabCurrentController);
        this.moveVector.copy(this.freeGrabCurrentController).sub(this.freeGrabStartController);
        this.pivot.object3D.position.copy(this.freeGrabStartModel).add(this.moveVector);

        this.controllerQuaternionInPivotParent(controller, this.freeGrabCurrentControllerQuat);
        this.freeGrabDeltaQuat.copy(this.freeGrabCurrentControllerQuat).multiply(this.freeGrabStartControllerQuatInv);
        this.pivot.object3D.quaternion.copy(this.freeGrabDeltaQuat).multiply(this.freeGrabStartModelQuat).normalize();

        this.updateInfo();
      },

      beginMoveGrab: function () {
        if (this.freeGrab3D || !this.right || this.grips.left) return;
        this.grabMoving = true;
        this.twoGripRotating = false;
        this.controllerPositionInPivotParent(this.right, this.grabStartController);
        this.grabStartModel.copy(this.pivot.object3D.position);
      },
      beginTwoGripRotation: function () {
        if (!this.left || !this.right) return;
        this.controllerPositionInPivotParent(this.left, this.leftPosition);
        this.controllerPositionInPivotParent(this.right, this.rightPosition);
        this.startHandVector.copy(this.rightPosition).sub(this.leftPosition);
        this.startHandVector.y = 0;
        if (this.startHandVector.lengthSq() < 0.0025) return;
        this.startHandAngle = Math.atan2(this.startHandVector.z, this.startHandVector.x);
        this.startModelRotationY = this.pivot.object3D.rotation.y;
        this.grabMoving = false;
        this.twoGripRotating = true;
      },
      updateMoveGrab: function () {
        if (!this.grabMoving || this.twoGripRotating || !this.grips.right) return;
        this.controllerPositionInPivotParent(this.right, this.controllerPosition);
        this.moveVector.copy(this.controllerPosition).sub(this.grabStartController);
        this.pivot.object3D.position.copy(this.grabStartModel).add(this.moveVector);
        this.updateInfo();
      },
      updateTwoGripRotation: function () {
        if (!this.twoGripRotating || !this.grips.left || !this.grips.right) return;
        this.controllerPositionInPivotParent(this.left, this.leftPosition);
        this.controllerPositionInPivotParent(this.right, this.rightPosition);
        this.currentHandVector.copy(this.rightPosition).sub(this.leftPosition);
        this.currentHandVector.y = 0;
        if (this.currentHandVector.lengthSq() < 0.0025) return;
        var angle = Math.atan2(this.currentHandVector.z, this.currentHandVector.x);
        this.pivot.object3D.rotation.y = this.startModelRotationY - (angle - this.startHandAngle);
        this.updateInfo();
      },
      updateVRMovement: function (dt) {
        var x = Math.abs(this.axes.left.x) > 0.12 ? this.axes.left.x : 0;
        var y = Math.abs(this.axes.left.y) > 0.12 ? this.axes.left.y : 0;
        if (x === 0 && y === 0) return;
        this.camera.object3D.getWorldQuaternion(this.cameraQuaternion);
        this.forward.set(0, 0, -1).applyQuaternion(this.cameraQuaternion);
        this.forward.y = 0;
        if (this.forward.lengthSq() < 0.0001) return;
        this.forward.normalize();
        this.rightVector.crossVectors(this.forward, MOJA.UP).normalize();
        this.moveVector.copy(this.rightVector).multiplyScalar(x).addScaledVector(this.forward, -y);
        if (this.moveVector.lengthSq() > 1) this.moveVector.normalize();
        this.rig.object3D.position.addScaledVector(this.moveVector, this.data.moveSpeed * dt);
      },
      updateVRTurning: function (dt) {
        var x = Math.abs(this.axes.right.x) > 0.14 ? this.axes.right.x : 0;
        if (x === 0) return;
        this.camera.object3D.getWorldPosition(this.cameraWorldBefore);
        this.rig.object3D.rotation.y -= x * THREE.MathUtils.degToRad(this.data.turnSpeed) * dt;
        this.rig.object3D.updateMatrixWorld(true);
        this.camera.object3D.getWorldPosition(this.cameraWorldAfter);
        this.rig.object3D.position.x += this.cameraWorldBefore.x - this.cameraWorldAfter.x;
        this.rig.object3D.position.z += this.cameraWorldBefore.z - this.cameraWorldAfter.z;
      },
      updateMRMovement: function (dt) {
        if (this.interactionMode !== 'move' || this.grabMoving || this.freeGrabMoving || this.twoGripRotating) return;
        var x = Math.abs(this.axes.left.x) > 0.12 ? this.axes.left.x : 0;
        var y = Math.abs(this.axes.left.y) > 0.12 ? this.axes.left.y : 0;
        if (x === 0 && y === 0) return;
        this.camera.object3D.getWorldQuaternion(this.cameraQuaternion);
        this.forward.set(0, 0, -1).applyQuaternion(this.cameraQuaternion);
        this.forward.y = 0;
        if (this.forward.lengthSq() < 0.0001) return;
        this.forward.normalize();
        this.rightVector.crossVectors(this.forward, MOJA.UP).normalize();
        this.moveVector.copy(this.rightVector).multiplyScalar(x).addScaledVector(this.forward, -y);
        if (this.moveVector.lengthSq() > 1) this.moveVector.normalize();
        this.pivot.object3D.position.addScaledVector(this.moveVector, this.data.modelMoveSpeed * dt);
        this.updateInfo();
      },
      updateVertical: function (dt) {
        var direction = (this.verticalUp ? 1 : 0) - (this.verticalDown ? 1 : 0);
        if (direction === 0) return;
        if (this.modeType === 'vr') {
          this.rig.object3D.position.y += direction * this.data.verticalSpeed * dt;
        } else if (this.placed && this.interactionMode === 'move') {
          this.pivot.object3D.position.y += direction * this.data.modelVerticalSpeed * dt;
          this.updateInfo();
        }
      },
      tick: function (time, delta) {
        if (!this.ready) return;
        var dt = Math.min(delta / 1000, 0.05);
        if (this.modeType === 'vr') {
          this.updateVRMovement(dt);
          this.updateVRTurning(dt);
          this.updateTeleportMarker();
        } else if (this.placed) {
          this.updateFreeGrab();
          this.updateMoveGrab();
          this.updateTwoGripRotation();
          this.updateMRMovement(dt);
        }
        this.updateVertical(dt);
      },
      remove: function () {
        this.el.removeEventListener('model-normalized', this.onNormalized);
        this.el.removeEventListener('ar-hit-test-select', this.onARSelect);
        this.el.removeEventListener('viewer-ui-action', this.onUIAction);
        if (this.right) this.right.removeEventListener('moja-ray-select', this.onRaySelect);
        window.removeEventListener('moja-scale-request', this.onScaleRequest);
      }
    });
  })();
  </script>

      <p id="landingDescription">Model jest zakotwiczony w skali 1:1. Poruszasz się użytkownikiem, mierzysz i zarządzasz widocznością komponentów.</p>

      <div id="mrScaleBox" class="scale-box" hidden>

          <a-plane class="annotation-ui ui-click" width="0.20" height="0.060" color="#334155" position="0.24 -0.155 0.012" viewer-button="action: annotation-text-size; value: 220">
            <a-text value="220 mm" align="center" width="0.30" color="#FFFFFF" position="0 0 0.006"></a-text>
          </a-plane>

          <a-plane class="annotation-ui ui-click" width="0.42" height="0.064" color="#7C3AED" position="0 -0.240 0.012" viewer-button="action: annotation-keyboard">
            <a-text value="WPISZ TEKST" align="center" width="0.52" color="#FFFFFF" position="0 0 0.006"></a-text>
          </a-plane>

          <a-plane class="annotation-ui ui-click" width="0.24" height="0.060" color="#475569" position="-0.27 -0.325 0.012" viewer-button="action: annotation-undo">
            <a-text value="COFNIJ" align="center" width="0.32" color="#FFFFFF" position="0 0 0.006"></a-text>
          </a-plane>
          <a-plane class="annotation-ui ui-click" width="0.24" height="0.060" color="#7F1D1D" position="0 -0.325 0.012" viewer-button="action: annotation-clear">
            <a-text value="WYCZYŚĆ" align="center" width="0.32" color="#FFFFFF" position="0 0 0.006"></a-text>
          </a-plane>
          <a-plane class="annotation-ui ui-click" width="0.24" height="0.060" color="#334155" position="0.27 -0.325 0.012" viewer-button="action: annotation-close">
            <a-text value="ZAMKNIJ" align="center" width="0.32" color="#FFFFFF" position="0 0 0.006"></a-text>
          </a-plane>
        </a-entity>

        <a-entity id="annotationKeyboard" position="0.10 0.15 -0.38" rotation="-32 0 0" scale="0.60 0.60 0.60" visible="false">
          <a-plane width="1.30" height="1.08" color="#07111F" opacity="0.99" material="shader: flat; transparent: true"></a-plane>
          <a-text value="KLAWIATURA 3D" align="center" anchor="center" baseline="center" width="1.16" color="#E9D5FF" position="0 0.465 0.010"></a-text>

          <a-plane width="1.16" height="0.120" color="#111827" position="0 0.365 0.012" material="shader: flat"></a-plane>
          <a-text id="annotationTextPreview" value="UWAGA" align="center" anchor="center" baseline="center" width="1.06" color="#FF3B30" position="0 0.365 0.020"></a-text>

          <a-text value="Trigger: wybierz znak  •  GOTOWE: wróć do adnotacji" align="center" width="1.08" color="#94A3B8" position="0 -0.500 0.010"></a-text>
        </a-entity>
      </a-entity>

      <a-entity
        id="rightHand"
        meta-touch-controls="hand: right"
        raycaster="objects: .ray-target; far: 50; showLine: false; lineColor: #38BDF8; lineOpacity: 0.95"
        trigger-ray="objects: .ray-target; marker: #pointerDot; color: #38BDF8; far: 50">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    (function () {
      'use strict';
      var mode = window.QUEST_MODE;
      var scene = document.getElementById('scene');
      var landing = document.getElementById('landing');
      var topTitle = document.getElementById('topTitle');
      var enterXR = document.getElementById('enterXR');
      var landingEnter = document.getElementById('landingEnter');
      var landingVersion = document.getElementById('landingVersion');
      var landingTitle = document.getElementById('landingTitle');
      var landingDescription = document.getElementById('landingDescription');
      var landingControls = document.getElementById('landingControls');
      var landingNote = document.getElementById('landingNote');
      var legend = document.getElementById('legend');
      var mrScaleBox = document.getElementById('mrScaleBox');
      var numberInput = document.getElementById('scaleNumber');
      var rangeInput = document.getElementById('scaleRange');

      function pills(values, target) {
        target.innerHTML = '';
        values.forEach(function (value) {
          var span = document.createElement('span');
          span.textContent = value;
          target.appendChild(span);
        });
      }

      if (mode === 'mr') {
        document.title = 'CK-207-74-5000_VR — Meta Quest MR v16';
        topTitle.textContent = 'CK-207-74-5000_VR • MIXED REALITY • v16';
        enterXR.textContent = 'ENTER MR';
        enterXR.classList.add('mr');
        landingVersion.textContent = 'META QUEST 3 • IMMERSIVE MR • v16';
        landingVersion.classList.add('mr');
        landingTitle.textContent = 'CK-207-74-5000_VR — Mixed Reality';
        landingDescription.textContent = 'Postaw model w pokoju, ustaw dokładną skalę, przesuń go i obróć wokół osi pionowej gestem dwóch gripów.';
        landingEnter.textContent = 'ENTER MR — QUEST 3';
        landingEnter.classList.add('mr');
        mrScaleBox.hidden = false;
        landingNote.textContent = 'Dwa gripy obracają model wokół jego geometrycznego środka — bez zmiany skali.';
        pills([
          'L joystick: przesuń model',
          'Prawy grip: przesunięcie / FREE GRAB 3D',
          '2 gripy: obrót osi Y',
          'B: góra  •  A: dół',
          'X: ruch → pomiar → komponenty → adnotacje',
          'Y: panel / wyczyść'
        ], landingControls);
        pills([
          'L: przesuń model',
          '2 gripy: obrót modelu',
          'B: góra  •  A: dół',
          'X: tryb',
          'Y: panel',
          'Trigger: wskaźnik punktowy'
        ], legend);
      } else {
        document.title = 'CK-207-74-5000_VR — Meta Quest VR v16';
        topTitle.textContent = 'CK-207-74-5000_VR • VR WALKAROUND • v16';
        enterXR.textContent = 'ENTER VR';
        landingVersion.textContent = 'META QUEST 3 • IMMERSIVE VR • v16';
        landingTitle.textContent = 'CK-207-74-5000_VR — Virtual Reality';
        landingDescription.textContent = 'Model pozostaje zakotwiczony w skali 1:1. Chodzisz, obracasz użytkownika, teleportujesz się, mierzysz i izolujesz komponenty.';
        landingEnter.textContent = 'ENTER VR — QUEST 3';
        landingNote.textContent = 'Model jest stały: 100% / 1:1 / środek układu współrzędnych.';
        pills([
          'L joystick: chodzenie',
          'R joystick: obrót użytkownika',
          'B: góra  •  A: dół',
          'Trigger: teleport / punkt  •  SNAP AUTO w pomiarze',
          'X: nawigacja → pomiar → komponenty → adnotacje',
          'Y: wyczyść / panel'
        ], landingControls);
        pills([
          'L: chodzenie',
          'R: obrót użytkownika',
          'B: góra  •  A: dół',
          'Trigger: teleport',
          'X: tryb',
          'Y: panel'
        ], legend);
      }

      function clampScale(value) {
        var parsed = Number(value);
        if (!Number.isFinite(parsed)) return Math.round(window.MOJA_START_SCALE || 100);
        return Math.max(10, Math.min(500, Math.round(parsed)));
      }

      function updateScaleInputs(value, emit) {
        var current = clampScale(value);
        window.MOJA_START_SCALE = current;
        numberInput.value = String(current);
        rangeInput.value = String(Math.max(10, Math.min(300, current)));
        try { window.localStorage.setItem('moja-ck-207-74-5000_vr-mr-scale', String(current)); } catch (error) {}
        if (emit) window.dispatchEvent(new CustomEvent('moja-scale-request', {detail: {percent: current}}));
      }

      updateScaleInputs(window.MOJA_START_SCALE, false);
      numberInput.addEventListener('change', function () { updateScaleInputs(numberInput.value, true); });
      numberInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          updateScaleInputs(numberInput.value, true);
          numberInput.blur();
        }
      });
      rangeInput.addEventListener('input', function () { updateScaleInputs(rangeInput.value, true); });
      document.querySelectorAll('[data-scale]').forEach(function (button) {
        button.addEventListener('click', function () { updateScaleInputs(button.getAttribute('data-scale'), true); });
      });
      window.addEventListener('moja-scale-changed', function (event) {
        updateScaleInputs(event.detail && event.detail.percent, false);
      });

      landingEnter.addEventListener('click', function () { enterXR.click(); });
      scene.addEventListener('enter-vr', function () { landing.style.display = 'none'; });
      scene.addEventListener('exit-vr', function () { landing.style.display = 'grid'; });
    })();
  </script>
</body>
</html>
