  <title>CK-207-74-5000_VR — Meta Quest Viewer v16</title>
  <script>
    window.MOJA_XR_MODEL = "CK-207-74-5000_VR";
  </script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      window.QUEST_MODE = params.get('mode') === 'mr' ? 'mr' : 'vr';
      var stored = 100;
      try {
        var parsed = Number(window.localStorage.getItem('moja-ck-207-74-5000_vr-mr-scale'));
        if (Number.isFinite(parsed)) stored = parsed;
      } catch (error) {
        stored = 100;
      }
      window.MOJA_START_SCALE = Math.max(10, Math.min(500, stored));
    })();
  </script>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 50% 34%, #1f2a3a 0%, #0b1220 72%);
    }
    .topbar {
      position: fixed;
      z-index: 1000;
      inset: 14px 14px auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(15,23,42,.86);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0,0,0,.20);
    }
    .title { pointer-events: none; color: #dbeafe; }
    .enter { background: #2563eb; border-color: #60a5fa; cursor: pointer; }
    .enter.mr { background: #16a34a; border-color: #4ade80; }
    .legend {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(94vw, 1060px);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: none;
    }
    .legend span {
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      background: rgba(15,23,42,.78);
      color: #dbeafe;
      font-size: 11px;
      backdrop-filter: blur(10px);
    }
    .landing {
      position: fixed;
      z-index: 1100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      pointer-events: none;
    }
    .card {
      width: min(94vw, 720px);
      padding: 22px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(15,23,42,.90);
      color: #fff;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      pointer-events: auto;
    }
    .version { color: #93c5fd; font-size: 11px; font-weight: 900; letter-spacing: .10em; }
    .version.mr { color: #86efac; }
    h1 { margin: 7px 0 6px; font-size: clamp(24px, 4vw, 36px); }
    p { margin: 6px auto; max-width: 630px; color: #cbd5e1; line-height: 1.45; font-size: 14px; }
    .scale-box {
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      gap: 12px;
      width: min(100%, 590px);
      margin: 18px auto 8px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(30,41,59,.78);
      text-align: left;
    }
    .scale-box label { color: #e2e8f0; font-size: 13px; font-weight: 800; }
    .scale-input { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }
    input[type="range"] { width: 100%; accent-color: #22c55e; }
    .presets, .actions, .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; }
    .presets { margin-top: 9px; }
    .controls { margin: 15px 0 4px; }
    .controls span { padding: 6px 9px; border-radius: 999px; background: #1e293b; color: #dbeafe; font-size: 11px; }
    .actions { margin-top: 18px; }
    .button, .preset {
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: #334155;
      color: #fff;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
    }
    .preset { min-height: 34px; padding: 0 12px; font-size: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; }
    .button.primary { background: #2563eb; border-color: #60a5fa; }
    .button.primary.mr { background: #16a34a; border-color: #4ade80; }
    .note { margin-top: 10px; color: #94a3b8; font-size: 11px; }
    @media (max-width: 720px) {
      .title { display: none; }
      .legend span { font-size: 10px; }
      .scale-box { grid-template-columns: 1fr; text-align: center; }
      .scale-input { grid-template-columns: 100px 1fr; }
      .controls { display: none; }
      .card { padding: 18px; }
    }
  </style>
  <script>
  (function () {
    'use strict';

    var MOJA = window.MOJA = {
      UP: new THREE.Vector3(0, 1, 0),
      clamp: function (value, min, max) {
        return Math.max(min, Math.min(max, value));
      },
      formatNumber: function (value, decimals) {
        if (!Number.isFinite(value)) return '—';
        return value.toFixed(decimals).replace('.', ',');
      },
      formatMetres: function (value) {
        if (!Number.isFinite(value)) return '—';
        return MOJA.formatNumber(value, value >= 10 ? 1 : 2);
      },
      formatDistance: function (metres) {
        if (!Number.isFinite(metres)) return '—';
        return MOJA.formatNumber(metres, 3) + ' m  •  ' + Math.round(metres * 1000) + ' mm';
      },
      formatScaleRatio: function (scale) {
        if (!Number.isFinite(scale) || scale <= 0) return '—';
        if (Math.abs(scale - 1) < 0.005) return '1:1';
        if (scale < 1) return '1:' + MOJA.formatNumber(1 / scale, 2);
        return MOJA.formatNumber(scale, 2) + ':1';
      },
      getInteractiveEl: function (intersection) {
        if (!intersection || !intersection.object) return null;
        var current = intersection.object;
        var fallback = null;
        while (current) {
          if (current.el) {
            if (!fallback) fallback = current.el;
            var classes = current.el.classList;
            if (classes && (
              classes.contains('ui-click') ||
              classes.contains('measure-target') ||
              classes.contains('teleportable') ||
              classes.contains('ray-target')
            )) return current.el;
          }
          current = current.parent;
        }
        return fallback;
      },
      isObjectInside: function (object, root) {
        var current = object;
        while (current) {
          if (current === root) return true;
          current = current.parent;
        }
        return false;
      },
      intersectionNormalY: function (intersection) {
        if (!intersection || !intersection.face || !intersection.object) return 1;
        var normal = intersection.face.normal.clone();
        normal.transformDirection(intersection.object.matrixWorld);
        return normal.y;
      },
      disableShadows: function (sceneEl, root) {
        if (sceneEl && sceneEl.renderer && sceneEl.renderer.shadowMap) {
          sceneEl.renderer.shadowMap.enabled = false;
          sceneEl.renderer.shadowMap.autoUpdate = false;
          sceneEl.renderer.shadowMap.needsUpdate = false;
        }
        if (!root) return;
        root.traverse(function (node) {
          if (!node.isMesh) return;
          node.castShadow = false;
          node.receiveShadow = false;
        });
      },
      addEdges: function (root) {
        if (!root) return;
        var meshes = [];
        root.traverse(function (node) {
          if (node.isMesh && node.geometry && !node.userData.mojaEdgeOverlay) meshes.push(node);
        });
        meshes.forEach(function (mesh) {
          if (mesh.userData.mojaEdgesAdded || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;
          mesh.userData.mojaEdgesAdded = true;
          var geometry;
          try {
            geometry = new THREE.EdgesGeometry(mesh.geometry, 32);
          } catch (error) {
            return;
          }
          var position = geometry.getAttribute('position');
          if (!position || position.count === 0) {
            geometry.dispose();
            return;
          }
          var material = new THREE.LineBasicMaterial({
            color: 0x26384c,
            transparent: true,
            opacity: window.QUEST_MODE === 'mr' ? 0.34 : 0.28,
            depthTest: true,
            depthWrite: false,
            toneMapped: false
          });
          var lines = new THREE.LineSegments(geometry, material);
          lines.name = '__MOJA_EDGES__';
          lines.userData.mojaEdgeOverlay = true;
          lines.renderOrder = 4;
          lines.raycast = function () {};
          mesh.add(lines);
        });
      },
      setEdgesVisible: function (root, visible) {
        if (!root) return;
        root.traverse(function (node) {
          if (node.userData && node.userData.mojaEdgeOverlay) node.visible = Boolean(visible);
        });
      }
    };

    AFRAME.registerComponent('model-normalizer', {
      schema: { pivot: {type: 'selector'} },
      init: function () {
        this.done = false;
        this.onLoaded = this.onLoaded.bind(this);
        this.el.addEventListener('model-loaded', this.onLoaded);
        if (this.el.getObject3D('mesh')) window.setTimeout(this.onLoaded, 0);
      },
      onLoaded: function () {
        if (this.done || !this.data.pivot) return;
        var mesh = this.el.getObject3D('mesh');
        if (!mesh) return;
        this.done = true;

        MOJA.disableShadows(this.el.sceneEl, mesh);
        MOJA.addEdges(mesh);

        var pivotObject = this.data.pivot.object3D;
        var assetObject = this.el.object3D;
        var savedPosition = pivotObject.position.clone();
        var savedQuaternion = pivotObject.quaternion.clone();
        var savedScale = pivotObject.scale.clone();
        var savedVisible = pivotObject.visible;

        pivotObject.position.set(0, 0, 0);
        pivotObject.quaternion.identity();
        pivotObject.scale.set(1, 1, 1);
        pivotObject.visible = true;
        assetObject.position.set(0, 0, 0);
        assetObject.updateMatrixWorld(true);

        var box = new THREE.Box3().setFromObject(assetObject);
        var center = box.getCenter(new THREE.Vector3());
        assetObject.position.x -= center.x;
        assetObject.position.y -= box.min.y;
        assetObject.position.z -= center.z;
        assetObject.updateMatrixWorld(true);
        box.setFromObject(assetObject);
        var size = box.getSize(new THREE.Vector3());

        pivotObject.position.copy(savedPosition);
        pivotObject.quaternion.copy(savedQuaternion);
        pivotObject.scale.copy(savedScale);
        pivotObject.visible = savedVisible;
        pivotObject.updateMatrixWorld(true);

        var detail = {asset: this.el, pivot: this.data.pivot, size: size.clone()};
        this.el.emit('model-normalized', detail, false);
        this.el.sceneEl.emit('model-normalized', detail, false);
      },
      remove: function () {
        this.el.removeEventListener('model-loaded', this.onLoaded);
      }
    });

    AFRAME.registerComponent('look-at-camera', {
      schema: {camera: {type: 'selector'}, yawOnly: {default: true}},
      init: function () {
        this.cameraPosition = new THREE.Vector3();
        this.ownPosition = new THREE.Vector3();
        this.lookPosition = new THREE.Vector3();
      },
      tick: function () {
        if (!this.data.camera) return;
        this.data.camera.object3D.getWorldPosition(this.cameraPosition);
        this.el.object3D.getWorldPosition(this.ownPosition);
        this.lookPosition.copy(this.cameraPosition);
        if (this.data.yawOnly) this.lookPosition.y = this.ownPosition.y;
        this.el.object3D.lookAt(this.lookPosition);
      }
    });

    AFRAME.registerComponent('metric-grid', {
      schema: {size: {type: 'number', default: 20}, divisions: {type: 'int', default: 20}, opacity: {type: 'number', default: 0.16}},
      init: function () { this.build(); },
      update: function () { this.build(); },
      build: function () {
        if (this.grid) {
          this.el.removeObject3D('mesh');
          this.grid.geometry.dispose();
          var oldMaterials = Array.isArray(this.grid.material) ? this.grid.material : [this.grid.material];
          oldMaterials.forEach(function (material) { material.dispose(); });
        }
        this.grid = new THREE.GridHelper(
          Math.max(2, this.data.size),
          Math.max(2, this.data.divisions),
          0x53677d,
          0xa8b5c4
        );
        var materials = Array.isArray(this.grid.material) ? this.grid.material : [this.grid.material];
        materials.forEach(function (material) {
          material.transparent = true;
          material.opacity = this.data.opacity;
          material.depthWrite = false;
        }, this);
        this.grid.position.y = 0.004;
        this.el.setObject3D('mesh', this.grid);
      },
      remove: function () {
        if (!this.grid) return;
        this.el.removeObject3D('mesh');
        this.grid.geometry.dispose();
        var materials = Array.isArray(this.grid.material) ? this.grid.material : [this.grid.material];
        materials.forEach(function (material) { material.dispose(); });
      }
    });

    AFRAME.registerComponent('trigger-ray', {
      schema: {
        objects: {default: '.ray-target'},
        marker: {type: 'selector'},
        color: {type: 'color', default: '#38BDF8'},
        far: {type: 'number', default: 50}
      },
      init: function () {
        this.active = false;
        this.currentIntersection = null;
        this.onTriggerDown = this.setActive.bind(this, true);
        this.onTriggerUp = this.handleTriggerUp.bind(this);
        this.configure = this.configure.bind(this);
        this.el.addEventListener('triggerdown', this.onTriggerDown);
        this.el.addEventListener('triggerup', this.onTriggerUp);
        this.el.addEventListener('controllerconnected', this.configure);
        window.setTimeout(this.configure, 0);
      },
      configure: function () {
        this.el.setAttribute('raycaster', {
          objects: this.data.objects,
          far: this.data.far,
          showLine: false,
          lineColor: this.data.color,
          lineOpacity: 0.95,
          interval: 0
        });
        this.refresh();
        if (this.data.marker) this.data.marker.object3D.visible = false;
      },
      refresh: function () {
        var raycaster = this.el.components.raycaster;
        if (raycaster && raycaster.refreshObjects) raycaster.refreshObjects();
      },
      setActive: function (active) {
        this.active = active;
        this.el.setAttribute('raycaster', 'showLine', false);
        if (!active && this.data.marker) this.data.marker.object3D.visible = false;
      },
      setColor: function (color) {
        this.el.setAttribute('raycaster', 'lineColor', color);
        if (this.data.marker) this.data.marker.setAttribute('color', color);
      },
      handleTriggerUp: function () {
        var rayComponent = this.el.components.raycaster;
        var intersections = rayComponent && rayComponent.intersections
          ? rayComponent.intersections.slice(0, 16)
          : (this.currentIntersection ? [this.currentIntersection] : []);
        var ray = rayComponent && rayComponent.raycaster && rayComponent.raycaster.ray
          ? rayComponent.raycaster.ray.clone()
          : null;
        this.el.emit('moja-ray-select', {
          intersection: this.currentIntersection,
          intersections: intersections,
          ray: ray,
          targetEl: MOJA.getInteractiveEl(this.currentIntersection)
        }, false);
        this.setActive(false);
      },
      tick: function () {
        var raycaster = this.el.components.raycaster;
        var intersections = raycaster && raycaster.intersections;
        this.currentIntersection = intersections && intersections.length ? intersections[0] : null;
        if (!this.active || !this.data.marker) return;
        if (!this.currentIntersection) {
          this.data.marker.object3D.visible = false;
          return;
        }
        this.data.marker.object3D.position.copy(this.currentIntersection.point);
        this.data.marker.object3D.visible = true;
      },
      remove: function () {
        this.el.removeEventListener('triggerdown', this.onTriggerDown);
        this.el.removeEventListener('triggerup', this.onTriggerUp);
        this.el.removeEventListener('controllerconnected', this.configure);
      }
    });

    AFRAME.registerComponent('measurement-tool', {
      schema: {
        target: {type: 'selector'},
        pointA: {type: 'selector'},
        pointB: {type: 'selector'},
        line: {type: 'selector'},
        label: {type: 'selector'},
        labelText: {type: 'selector'},
        color: {type: 'color', default: '#F59E0B'}
      },

      init: function () {
        this.enabled = false;
        this.points = [null, null];
        this.worldA = new THREE.Vector3();
        this.worldB = new THREE.Vector3();
        this.pathX = new THREE.Vector3();
        this.pathXY = new THREE.Vector3();
        this.midpoint = new THREE.Vector3();
        this.localA = new THREE.Vector3();
        this.localB = new THREE.Vector3();
        this.localPathX = new THREE.Vector3();
        this.localPathXY = new THREE.Vector3();
        this.targetScale = new THREE.Vector3(1, 1, 1);
        this.axisVisuals = {};
        this.snapEngine = window.MOJA_SNAP
          ? window.MOJA_SNAP.createEngine(THREE, {maxAngleRad: 0.018, featureAngleDeg: 18})
          : null;
        this.createAxisVisuals();
        this.styleMainLabel();
        this.clear();
      },

      createElement: function (tag, attributes, parent) {
        var element = document.createElement(tag);
        Object.keys(attributes || {}).forEach(function (name) {
element.setAttribute(name, attributes[name]);
        });
        (parent || this.el).appendChild(element);
        return element;
      },

      createAxisVisual: function (axis, color) {
        var line = this.createElement('a-entity', {
line: 'start: 0 0 0; end: 0 0 0; color: ' + color + '; opacity: 0.96',
visible: 'false'
        });
        var label = this.createElement('a-entity', {
'look-at-camera': 'camera: #camera; yawOnly: false',
scale: '0.34 0.34 0.34',
visible: 'false'
        });
        this.createElement('a-plane', {
width: '1.06',
height: '0.145',
color: '#0B1220',
opacity: '0.48',
material: 'shader: flat; transparent: true; depthWrite: false'
        }, label);
        var text = this.createElement('a-text', {
value: axis,
align: 'center',
anchor: 'center',
baseline: 'center',
width: '0.98',
color: color,
position: '0 0 0.006'
        }, label);
        return {line: line, label: label, text: text, color: color};
      },

      createAxisVisuals: function () {
        this.axisVisuals.x = this.createAxisVisual('ΔX', '#EF4444');
        this.axisVisuals.y = this.createAxisVisual('ΔY', '#22C55E');
        this.axisVisuals.z = this.createAxisVisual('ΔZ', '#3B82F6');
      },

      styleMainLabel: function () {
        if (!this.data.label) return;
        var plane = this.data.label.querySelector('a-plane');
        if (plane) {
plane.setAttribute('width', 1.78);
plane.setAttribute('height', 0.315);
plane.setAttribute('opacity', 0.58);
plane.setAttribute('material', 'shader: flat; transparent: true; depthWrite: false');
        }
        if (this.data.labelText) {
this.data.labelText.setAttribute('width', 1.64);
this.data.labelText.setAttribute('color', '#FDE68A');
        }
      },

      setEnabled: function (enabled) {
        this.enabled = Boolean(enabled);
      },

      toggle: function () {
        this.setEnabled(!this.enabled);
        return this.enabled;
      },

      isEnabled: function () {
        return this.enabled;
      },

      pointFromIntersection: function (intersection, ray, intersections) {
        if ((!intersection || !intersection.point) && !ray) return null;
        var targetObject = this.data.target && this.data.target.object3D;
        var usableIntersections = Array.isArray(intersections) ? intersections : (intersection ? [intersection] : []);
        if (targetObject) {
          usableIntersections = usableIntersections.filter(function (candidate) {
            return candidate && candidate.object && MOJA.isObjectInside(candidate.object, targetObject);
          });
        }

        var snap = this.snapEngine && ray
          ? this.snapEngine.snapFromIntersections(usableIntersections, ray, {
              maxAngleRad: 0.018,
              searchRoot: targetObject
            })
          : null;
        if ((!snap || !snap.point) && (!intersection || !intersection.point)) return null;

        var worldPoint = snap && snap.point ? snap.point.clone() : intersection.point.clone();
        var snapLabel = snap && snap.label ? snap.label : 'PUNKT POWIERZCHNI';
        var snapKind = snap && snap.kind ? snap.kind : 'surface';
        var sourceObject = snap && snap.object ? snap.object : (intersection && intersection.object);

        if (targetObject && sourceObject && MOJA.isObjectInside(sourceObject, targetObject)) {
          targetObject.updateMatrixWorld(true);
          return {
            space: 'target',
            value: targetObject.worldToLocal(worldPoint),
            snapKind: snapKind,
            snapLabel: snapLabel
          };
        }
        return {space: 'world', value: worldPoint, snapKind: snapKind, snapLabel: snapLabel};
      },

      resolvePoint: function (stored, output) {
        if (!stored) return null;
        output.copy(stored.value);
        if (stored.space === 'target' && this.data.target) {
this.data.target.object3D.updateMatrixWorld(true);
this.data.target.object3D.localToWorld(output);
        }
        return output;
      },

      addIntersection: function (intersection, ray, intersections) {
        if (!this.enabled) return false;
        var point = this.pointFromIntersection(intersection, ray, intersections);
        if (!point) return false;
        if (this.points[0] && this.points[1]) this.clear();
        if (!this.points[0]) this.points[0] = point;
        else this.points[1] = point;
        this.updateVisual();
        return true;
      },

      hideAxisVisual: function (visual) {
        if (!visual) return;
        visual.line.object3D.visible = false;
        visual.label.object3D.visible = false;
      },

      clear: function () {
        this.points[0] = null;
        this.points[1] = null;
        if (this.data.pointA) this.data.pointA.object3D.visible = false;
        if (this.data.pointB) this.data.pointB.object3D.visible = false;
        if (this.data.line) this.data.line.object3D.visible = false;
        if (this.data.label) this.data.label.object3D.visible = false;
        this.hideAxisVisual(this.axisVisuals.x);
        this.hideAxisVisual(this.axisVisuals.y);
        this.hideAxisVisual(this.axisVisuals.z);
      },

      setLine: function (element, start, end, color) {
        element.setAttribute('line', {
start: start,
end: end,
color: color,
opacity: 0.96
        });
        element.object3D.visible = true;
      },

      setAxisVisual: function (visual, start, end, value, axis) {
        var length = start.distanceTo(end);
        if (length < 0.00005) {
this.hideAxisVisual(visual);
return;
        }
        this.setLine(visual.line, start, end, visual.color);
        this.midpoint.copy(start).add(end).multiplyScalar(0.5);
        var offset = Math.max(0.018, Math.min(0.085, length * 0.035));
        if (axis === 'y') this.midpoint.x += offset;
        else this.midpoint.y += offset;
        visual.label.object3D.position.copy(this.midpoint);
        var labelScale = MOJA.clamp(length * 0.075, 0.24, 0.46);
        visual.label.object3D.scale.setScalar(labelScale);
        visual.text.setAttribute('value', 'Δ' + axis.toUpperCase() + '  ' + Math.round(value * 1000) + ' mm');
        visual.label.object3D.visible = true;
      },

      calculateOrthogonalPath: function () {
        var first = this.points[0];
        var second = this.points[1];
        var targetObject = this.data.target && this.data.target.object3D;
        var localMode = first.space === 'target' && second.space === 'target' && targetObject;
        var dx;
        var dy;
        var dz;

        if (localMode) {
this.localA.copy(first.value);
this.localB.copy(second.value);
this.localPathX.set(this.localB.x, this.localA.y, this.localA.z);
this.localPathXY.set(this.localB.x, this.localB.y, this.localA.z);

this.worldA.copy(this.localA);
this.pathX.copy(this.localPathX);
this.pathXY.copy(this.localPathXY);
this.worldB.copy(this.localB);
targetObject.updateMatrixWorld(true);
targetObject.localToWorld(this.worldA);
targetObject.localToWorld(this.pathX);
targetObject.localToWorld(this.pathXY);
targetObject.localToWorld(this.worldB);
targetObject.getWorldScale(this.targetScale);

dx = Math.abs(this.localB.x - this.localA.x) * Math.abs(this.targetScale.x);
dy = Math.abs(this.localB.y - this.localA.y) * Math.abs(this.targetScale.y);
dz = Math.abs(this.localB.z - this.localA.z) * Math.abs(this.targetScale.z);
        } else {
this.resolvePoint(first, this.worldA);
this.resolvePoint(second, this.worldB);
this.pathX.set(this.worldB.x, this.worldA.y, this.worldA.z);
this.pathXY.set(this.worldB.x, this.worldB.y, this.worldA.z);
dx = Math.abs(this.worldB.x - this.worldA.x);
dy = Math.abs(this.worldB.y - this.worldA.y);
dz = Math.abs(this.worldB.z - this.worldA.z);
        }

        return {dx: dx, dy: dy, dz: dz, local: Boolean(localMode)};
      },

      updateVisual: function () {
        if (!this.points[0]) {
this.clear();
return;
        }

        this.resolvePoint(this.points[0], this.worldA);
        if (this.data.pointA) {
this.data.pointA.object3D.position.copy(this.worldA);
this.data.pointA.object3D.visible = true;
        }

        if (!this.points[1]) {
if (this.data.pointB) this.data.pointB.object3D.visible = false;
if (this.data.line) this.data.line.object3D.visible = false;
if (this.data.label) this.data.label.object3D.visible = false;
this.hideAxisVisual(this.axisVisuals.x);
this.hideAxisVisual(this.axisVisuals.y);
this.hideAxisVisual(this.axisVisuals.z);
return;
        }

        var components = this.calculateOrthogonalPath();
        if (this.data.pointA) this.data.pointA.object3D.position.copy(this.worldA);
        if (this.data.pointB) {
this.data.pointB.object3D.position.copy(this.worldB);
this.data.pointB.object3D.visible = true;
        }

        if (this.data.line) {
this.setLine(this.data.line, this.worldA, this.worldB, this.data.color);
        }

        this.setAxisVisual(this.axisVisuals.x, this.worldA, this.pathX, components.dx, 'x');
        this.setAxisVisual(this.axisVisuals.y, this.pathX, this.pathXY, components.dy, 'y');
        this.setAxisVisual(this.axisVisuals.z, this.pathXY, this.worldB, components.dz, 'z');

        var distance = this.worldA.distanceTo(this.worldB);
        this.midpoint.copy(this.worldA).add(this.worldB).multiplyScalar(0.5);
        this.midpoint.y += Math.max(0.045, Math.min(0.22, distance * 0.045));

        if (this.data.label) {
this.data.label.object3D.position.copy(this.midpoint);
var mainScale = MOJA.clamp(distance * 0.07, 0.28, 0.52);
this.data.label.object3D.scale.setScalar(mainScale);
this.data.label.object3D.visible = true;
        }
        if (this.data.labelText) {
var coordinateText = components.local ? 'OSIE MODELU' : 'OSIE ŚWIATA';
this.data.labelText.setAttribute(
  'value',
  'L  ' + MOJA.formatDistance(distance) + '\n' +
  'ΔX ' + Math.round(components.dx * 1000) + '  •  ' +
  'ΔY ' + Math.round(components.dy * 1000) + '  •  ' +
  'ΔZ ' + Math.round(components.dz * 1000) + ' mm  •  ' + coordinateText + '\n' +
  'SNAP A: ' + (this.points[0].snapLabel || 'PUNKT') + '  •  B: ' + (this.points[1].snapLabel || 'PUNKT')
);
        }
      },

      tick: function () {
        if (this.points[0]) this.updateVisual();
      },

      remove: function () {
        var self = this;
        ['x', 'y', 'z'].forEach(function (axis) {
var visual = self.axisVisuals[axis];
if (!visual) return;
if (visual.line.parentNode) visual.line.parentNode.removeChild(visual.line);
if (visual.label.parentNode) visual.label.parentNode.removeChild(visual.label);
        });
      }
    });

    AFRAME.registerComponent('lighting-control', {
      schema: {
        ambient: {type: 'selector'},
        front: {type: 'selector'},
        back: {type: 'selector'},
        left: {type: 'selector'},
        right: {type: 'selector'},
        top: {type: 'selector'},
        bottom: {type: 'selector'},
        panel: {type: 'selector'},
        valueText: {type: 'selector'},
        detailText: {type: 'selector'},
        storageKey: {default: 'moja-ck-207-74-5000_vr-mr-scale-lighting360'}
      },

      init: function () {
        this.panelVisible = false;
        this.percent = 100;

        this.onUIAction = this.onUIAction.bind(this);
        this.el.addEventListener('viewer-ui-action', this.onUIAction);

        this.load();
        this.apply();
        this.setPanelVisible(false);
      },

      clampPercent: function (value) {
        var number = Number(value);
        if (!Number.isFinite(number)) number = 100;
        return Math.round(MOJA.clamp(number, 25, 1000));
      },

      load: function () {
        try {
          var raw = window.localStorage.getItem(this.data.storageKey);
          if (!raw) return;

          var saved = JSON.parse(raw);
          if (Number.isFinite(saved.percent)) {
            this.percent = this.clampPercent(saved.percent);
          }
        } catch (error) {}
      },

      save: function () {
        try {
          window.localStorage.setItem(
            this.data.storageKey,
            JSON.stringify({percent: this.percent})
          );
        } catch (error) {}
      },

      setIntensity: function (element, intensity) {
        if (!element) return;
        element.setAttribute('light', 'intensity', Math.max(0, intensity));
      },

      apply: function () {
        var factor = this.percent / 100;

        /*
          Oświetlenie 360° pod CAD.
          Nie używamy map cieni.
          Wszystkie kierunki są sterowane jednym procentem.
        */
        this.setIntensity(this.data.ambient, 0.12 * factor);

        this.setIntensity(this.data.front,  0.18 * factor);
        this.setIntensity(this.data.back,   0.18 * factor);
        this.setIntensity(this.data.left,   0.18 * factor);
        this.setIntensity(this.data.right,  0.18 * factor);
        this.setIntensity(this.data.top,    0.24 * factor);
        this.setIntensity(this.data.bottom, 0.10 * factor);

        this.updatePanel();
        this.save();
      },

      setPanelVisible: function (visible) {
        this.panelVisible = Boolean(visible);
        if (this.data.panel) this.data.panel.object3D.visible = this.panelVisible;
        this.updateInteractivity();
        this.updatePanel();

        var viewer = this.el.components['quest-viewer'];
        if (viewer && viewer.refreshRaycaster) viewer.refreshRaycaster();
      },

      updateInteractivity: function () {
        if (!this.data.panel) return;
        var active = this.panelVisible;

        this.data.panel.querySelectorAll('.lighting-ui').forEach(function (control) {
          if (active) control.classList.add('ray-target');
          else control.classList.remove('ray-target');
        });
      },

      updatePanel: function () {
        if (this.data.valueText) {
          this.data.valueText.setAttribute('value', 'NATĘŻENIE  ' + this.percent + '%');
        }

        if (this.data.detailText) {
          this.data.detailText.setAttribute(
            'value',
            'ŚWIATŁO 360°  •  PRZÓD / TYŁ / LEWO / PRAWO / GÓRA / DÓŁ'
          );
        }
      },

      changePercent: function (delta) {
        this.percent = this.clampPercent(this.percent + (Number(delta) || 0));
        this.apply();
      },

      setStandard: function () {
        this.percent = 100;
        this.apply();
      },

      backToComponents: function () {
        this.setPanelVisible(false);
        var selection = this.el.components['component-selection'];
        if (selection && selection.enabled) selection.setPanelVisible(true);
      },

      onUIAction: function (event) {
        var detail = event.detail || {};

        switch (detail.action) {
          case 'lighting-open':
            var selection = this.el.components['component-selection'];
            if (selection) selection.setPanelVisible(false);
            this.setPanelVisible(true);
            break;

          case 'lighting-close':
            this.backToComponents();
            break;

          case 'lighting-global':
            this.changePercent(detail.value);
            break;

          case 'lighting-reset':
            this.setStandard();
            break;
        }
      },

      remove: function () {
        this.el.removeEventListener('viewer-ui-action', this.onUIAction);
      }
    });

      getControllerTipWorld: function (output) {

      worldToAnnotationLocal: function (world, output) {

          this.data.root.object3D.updateMatrixWorld(true);

      isPointingAtAnnotationUI: function () {
        if (!this.data.right) return false;
        var ray = this.data.right.components['trigger-ray'];
        var intersection = ray && ray.currentIntersection;
        var target = MOJA.getInteractiveEl(intersection);

        ));

      beginStroke: function () {
        if (!this.data.root) return;

        this.currentStroke = new THREE.Group();

        this.data.root.object3D.add(this.currentStroke);

        this.getControllerTipWorld(this.worldPoint);

      addStrokeSegment: function (a, b) {
        if (!this.currentStroke) return;
        var distance = a.distanceTo(b);
        if (!Number.isFinite(distance) || distance < 0.004) return;

        var radius = Math.max(0.001, this.thicknessMm / 2000);
        var geometry = new THREE.CylinderGeometry(radius, radius, distance, 8, 1, false);
        var material = new THREE.MeshBasicMaterial({
          color: new THREE.Color(this.color),
          depthTest: true,
          depthWrite: true,
          toneMapped: false
        });
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.copy(a).add(b).multiplyScalar(0.5);

        var direction = b.clone().sub(a).normalize();
        mesh.quaternion.setFromUnitVectors(this.yAxis, direction);
        mesh.renderOrder = 12;
        this.currentStroke.add(mesh);

        if (!this.enabled || this.tool !== 'draw' || !this.drawing) return;
        this.getControllerTipWorld(this.worldPoint);
        this.worldToAnnotationLocal(this.worldPoint, this.currentPoint);

        if (this.currentPoint.distanceTo(this.lastPoint) < 0.008) return;

        this.addStrokeSegment(this.lastPoint, this.currentPoint);
        this.lastPoint.copy(this.currentPoint);
      },

      resolveTextPlacementWorld: function (output) {
        var ray = this.data.right && this.data.right.components['trigger-ray'];
        var intersection = ray && ray.currentIntersection;
        var target = MOJA.getInteractiveEl(intersection);

        if (intersection && intersection.point &&
            !(target && target.classList && (
              target.classList.contains('annotation-ui') ||
              target.classList.contains('annotation-key')
            ))) {
          output.copy(intersection.point);
          if (intersection.face && intersection.object) {
            var normal = intersection.face.normal.clone();
            normal.transformDirection(intersection.object.matrixWorld);
            output.addScaledVector(normal, 0.018);
          }
          return output;
        }

        if (!this.data.right) return output.set(0, 1.4, -1);
        this.data.right.object3D.getWorldPosition(output);
        this.data.right.object3D.getWorldQuaternion(this.controllerQuat);
        this.forward.set(0, 0, -0.7).applyQuaternion(this.controllerQuat);
        output.add(this.forward);
        return output;
      },

      createTextSprite: function (value) {
        var fontPx = 132;
        var padX = 58;
        var padY = 34;
        var radius = 28;

        var measureCanvas = document.createElement('canvas');
        var measureContext = measureCanvas.getContext('2d');
        measureContext.font = '700 ' + fontPx + 'px Arial, sans-serif';

        var metrics = measureContext.measureText(value);
        var textWidth = Math.ceil(metrics.width);
        var canvasWidth = Math.max(512, Math.min(2048, textWidth + padX * 2));
        var canvasHeight = 256;

        var canvas = document.createElement('canvas');
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        var context = canvas.getContext('2d');
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Ciemne tło z jasną ramką - dużo czytelniejsze na modelu i passthrough.
        context.fillStyle = 'rgba(7,17,31,0.92)';
        context.strokeStyle = this.color;
        context.lineWidth = 8;

        var x = 6;
        var y = 6;
        var w = canvas.width - 12;
        var h = canvas.height - 12;

        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + w - radius, y);
        context.quadraticCurveTo(x + w, y, x + w, y + radius);
        context.lineTo(x + w, y + h - radius);
        context.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        context.lineTo(x + radius, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
        context.fill();
        context.stroke();

        context.font = '700 ' + fontPx + 'px Arial, sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        // Cienki czarny obrys liter poprawia czytelność na jasnym tle.
        context.lineWidth = 10;
        context.strokeStyle = 'rgba(0,0,0,0.92)';
        context.strokeText(value, canvas.width / 2, canvas.height / 2 + 2);

        context.fillStyle = this.color;
        context.fillText(value, canvas.width / 2, canvas.height / 2 + 2);

        var texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        var material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: true,
          depthWrite: false,
          toneMapped: false
        });

        var sprite = new THREE.Sprite(material);
        sprite.name = '__MOJA_ANNOTATION_TEXT__';
        sprite.renderOrder = 18;

        // textSizeMm steruje wysokością etykiety w świecie.
        var worldHeight = Math.max(0.055, this.textSizeMm / 1000);
        var aspect = canvas.width / canvas.height;
        sprite.scale.set(worldHeight * aspect, worldHeight, 1);

        sprite.userData.mojaCanvasTexture = texture;
        return sprite;
      },

      placeText: function () {
        if (!this.data.root) return;

        var value = String(this.textBuffer || '').trim();
        if (!value) value = 'UWAGA';

        // Punkt bierze się z AKTUALNEGO wskaźnika w chwili puszczenia Triggera.
        this.resolveTextPlacementWorld(this.worldPoint);
        this.worldToAnnotationLocal(this.worldPoint, this.currentPoint);

        var sprite = this.createTextSprite(value);
        sprite.position.copy(this.currentPoint);

        this.data.root.object3D.add(sprite);
        this.items.push({type: 'text-sprite', object: sprite});
      },

      disposeObject: function (object) {
        if (!object) return;

          if (node.geometry && node.geometry.dispose) node.geometry.dispose();
          if (node.material) {
            if (Array.isArray(node.material)) {
              node.material.forEach(function (material) {
                if (material && material.dispose) material.dispose();

            } else if (node.material.dispose) {

            }

          if (item.object.material) {
            if (item.object.material.map && item.object.material.map.dispose) {
              item.object.material.map.dispose();
            }
            if (item.object.material.dispose) item.object.material.dispose();
          }
          if (item.object.parent) item.object.parent.remove(item.object);

      buildKeyboard: function () {

        var rows = [
          '1234567890',
          'QWERTYUIOP',
          'ASDFGHJKL',
          'ZXCVBNM',
          'ĄĆĘŁŃÓŚŹŻ'
        ];

        rows.forEach(function (row, rowIndex) {
          var chars = Array.from(row);
          var count = chars.length;
          var keyPitch = Math.min(0.112, 1.12 / count);
          var keyWidth = keyPitch - 0.010;
          var startX = -((count - 1) * keyPitch) / 2;
          var y = 0.235 - rowIndex * 0.105;

          chars.forEach(function (character, index) {
            var key = document.createElement('a-plane');
            key.setAttribute('class', 'annotation-key ui-click');
            key.setAttribute('width', keyWidth);
            key.setAttribute('height', '0.086');
            key.setAttribute('color', '#1E3A5F');
            key.setAttribute('position', (startX + index * keyPitch) + ' ' + y + ' 0.012');
            key.setAttribute('material', 'shader: flat');

            var label = document.createElement('a-text');
            label.setAttribute('value', character);
            label.setAttribute('align', 'center');
            label.setAttribute('anchor', 'center');
            label.setAttribute('baseline', 'center');
            label.setAttribute('width', Math.max(0.18, keyWidth * 3.15));
            label.setAttribute('color', '#FFFFFF');
            label.setAttribute('position', '0 0 0.008');
            key.appendChild(label);

            key.addEventListener('click', function () {
              self.acceptKeyInput(function () {
                if (self.textBuffer.length < 42) self.textBuffer += character;
              });
            });

            self.data.keyboard.appendChild(key);
          });
        });

          var key = document.createElement('a-plane');
          key.setAttribute('class', 'annotation-key ui-click');
          key.setAttribute('width', width);
          key.setAttribute('height', '0.082');
          key.setAttribute('color', color);
          key.setAttribute('position', x + ' ' + y + ' 0.012');
          key.setAttribute('material', 'shader: flat');

          var text = document.createElement('a-text');
          text.setAttribute('value', label);
          text.setAttribute('align', 'center');
          text.setAttribute('anchor', 'center');
          text.setAttribute('baseline', 'center');
          text.setAttribute('width', width * 1.9);
          text.setAttribute('color', '#FFFFFF');
          text.setAttribute('position', '0 0 0.008');
          key.appendChild(text);

          key.addEventListener('click', function () {

      isMeaningfulName: function (name) {

          .replace(/[_]+/g, ' ')

      collectAliases: function (data) {
        var aliases = [];

          data && data.fileName,

          data && data.name

        values.forEach(function (value) {

      objectDepthFrom: function (object, parentObject) {

          depth += 1;
          current = current.parent;

        return current === parentObject ? depth : 1000;
      },

      findBestObject: function (data, parentObject, rootObject, allowParent) {
        var aliases = this.collectAliases(data);
        var exactAliases = aliases.map(function (value) {
          return this.compactName(value, false);
        }, this).filter(Boolean);
        var baseAliases = aliases.map(function (value) {
          return this.compactName(value, true);
        }, this).filter(Boolean);

        var searchRoot = parentObject || rootObject;
        var candidates = [];
        var self = this;

        if (allowParent && searchRoot && searchRoot.name && this.isMeaningfulName(searchRoot.name)) {
          candidates.push(searchRoot);

        if (searchRoot) {
          searchRoot.traverse(function (object) {
            if (object === searchRoot) return;
            if (!self.isMeaningfulName(object.name)) return;
            if (self.objectAssigned.has(object)) return;
            candidates.push(object);

        }

        function scoreObject(object) {
          var exact = self.compactName(object.name, false);
          var base = self.compactName(object.name, true);
          var score = 0;

          if (exact && exactAliases.indexOf(exact) >= 0) score = 1000;
          else if (base && baseAliases.indexOf(base) >= 0) score = 700;
          else {
            exactAliases.forEach(function (alias) {
              if (!alias || !exact) return;
              if (exact.indexOf(alias) >= 0 || alias.indexOf(exact) >= 0) score = Math.max(score, 320);
            });
          }

          if (score > 0 && parentObject) {
            var depth = self.objectDepthFrom(object, parentObject);
            if (depth < 1000) score += Math.max(0, 80 - depth * 6);
          }

          return score;
        }

        var best = null;
        var bestScore = 0;

        candidates.forEach(function (candidate) {
          var score = scoreObject(candidate);
          if (score > bestScore) {
            best = candidate;
            bestScore = score;
          }
        });

        if (!best && searchRoot !== rootObject && rootObject) {
          rootObject.traverse(function (object) {
            if (best || object === rootObject || !self.isMeaningfulName(object.name)) return;
            if (self.objectAssigned.has(object)) return;
            if (scoreObject(object) >= 700) best = object;
          });
        }

        if (best && best !== rootObject) this.objectAssigned.add(best);
        return best;
      },

      createNode: function (data, parentIndex, depth, object) {
        var partNumber = this.cleanDisplayName(data && data.partNumber);
        var occurrenceName = this.cleanDisplayName(data && data.occurrenceName);
        var fileName = this.cleanDisplayName(data && data.fileName);
        var objectName = this.cleanDisplayName(object && object.name);
        var labelBase = partNumber || fileName || occurrenceName || objectName || 'Obiekt';
        var index = this.treeNodes.length;
        var node = {
          index: index,
          id: String((data && data.id) || ('node-' + index)),
          parentIndex: Number.isInteger(parentIndex) ? parentIndex : -1,
          children: [],
          depth: Math.max(0, depth || 0),
          object: object || null,
          meshes: [],
          partNumber: partNumber,
          occurrenceName: occurrenceName,
          fileName: fileName,
          description: String((data && data.description) || '').trim(),
          material: String((data && data.material) || '').trim(),
          massKg: data && Number.isFinite(Number(data.massKg)) ? Number(data.massKg) : null,
          documentType: String((data && data.documentType) || '').toLowerCase(),
          suppressed: Boolean(data && data.suppressed),
          sourceVisible: !(data && data.visible === false),
          labelBase: labelBase,
          label: labelBase,
          expanded: depth === 0

        this.treeNodes.push(node);

        if (node.parentIndex >= 0 && this.treeNodes[node.parentIndex]) {
          this.treeNodes[node.parentIndex].children.push(index);
        } else {

        }

      buildStructureNode: function (data, parentIndex, parentObject, rootObject, depth, isRoot) {

        var nodeIndex = this.createNode(data, parentIndex, depth, mappedObject);
        var children = Array.isArray(data.children) ? data.children : [];
        var nextParentObject = mappedObject || parentObject || rootObject;

        children.forEach(function (child) {
          this.buildStructureNode(child, nodeIndex, nextParentObject, rootObject, depth + 1, false);
        }, this);

        return nodeIndex;
      },

      buildFromStructure: function (structure, rootObject) {
        this.structureSource = 'IAM';
        this.objectAssigned = new WeakSet();
        this.buildStructureNode(structure.root, -1, rootObject, rootObject, 0, true);
      },

      buildFromGlb: function (rootObject) {
        var self = this;
        this.structureSource = 'GLB';
        var rootIndex = this.createNode({
          id: 'root',
          partNumber: 'CK-207-74-5000_VR',
          occurrenceName: rootObject.name || 'CK-207-74-5000_VR',
          documentType: 'assembly'
        }, -1, 0, rootObject);

        function hasMesh(object) {
          var found = false;
          object.traverse(function (child) {
            if (child.isMesh && !(child.userData && child.userData.mojaEdgeOverlay)) found = true;
          });
          return found;

        function walk(object, parentIndex, depth) {
          var nextParent = parentIndex;

          if (object !== rootObject && self.isMeaningfulName(object.name) && hasMesh(object)) {
            nextParent = self.createNode({
              id: 'glb-' + self.treeNodes.length,
              partNumber: self.cleanDisplayName(object.name),
              occurrenceName: object.name,
              documentType: object.isMesh ? 'part' : 'assembly'

          object.children.forEach(function (child) {
            walk(child, nextParent, nextParent === parentIndex ? depth : depth + 1);

          walk(child, rootIndex, 1);

              id: 'mesh-' + index,
              partNumber: self.cleanDisplayName(mesh.name) || ('Obiekt ' + String(index + 1).padStart(3, '0')),
              occurrenceName: mesh.name,

      collectNodeMeshes: function (node) {

        node.children.forEach(function (childIndex) {
          var child = this.treeNodes[childIndex];

      assignSiblingLabels: function () {

      selectIntersection: function (intersection) {

      revealIndex: function (index) {
        var node = this.treeNodes[index];
        if (!node) return;
        var current = node.parentIndex;

        while (current >= 0 && this.treeNodes[current]) {
          this.treeNodes[current].expanded = true;
          current = this.treeNodes[current].parentIndex;
        }

        var rows = this.flattenTree();
        var rowIndex = rows.indexOf(index);
        if (rowIndex < 0) return;

        if (rowIndex < this.scrollOffset) this.scrollOffset = rowIndex;
        if (rowIndex >= this.scrollOffset + this.data.rows) {
          this.scrollOffset = rowIndex - this.data.rows + 1;
        }
      },

      toggleIndex: function (index, reveal) {
        if (!Number.isInteger(index) || index < 0 || index >= this.treeNodes.length) return;
        var node = this.treeNodes[index];
        if (!node || node.meshes.length === 0) return;

        if (this.selected.has(index)) this.selected.delete(index);
        else this.selected.add(index);

        if (reveal) this.revealIndex(index);
        this.syncHelpers();
        this.renderPanel();
      },

      toggleExpanded: function (index) {
        var node = this.treeNodes[index];
        if (!node || node.children.length === 0) return;
        node.expanded = !node.expanded;
        this.renderPanel();
      },

      expandAll: function () {
        this.treeNodes.forEach(function (node) {
          if (node.children.length > 0) node.expanded = true;
        });
        this.scrollOffset = 0;
        this.renderPanel();
      },

      collapseAll: function () {
        this.treeNodes.forEach(function (node) {
          node.expanded = node.depth === 0;
        });
        this.scrollOffset = 0;
        this.renderPanel();
      },

      flattenTree: function () {
        var rows = [];
        var self = this;

        function visit(index) {
          var node = self.treeNodes[index];
          if (!node) return;
          rows.push(index);
          if (!node.expanded) return;
          node.children.forEach(visit);
        }

        this.rootIndexes.forEach(visit);
        this.flatRows = rows;
        return rows;
      },

      scrollBy: function (delta) {
        var rows = this.flattenTree();
        var maximum = Math.max(0, rows.length - this.data.rows);
        this.scrollOffset = MOJA.clamp(this.scrollOffset + Number(delta || 0), 0, maximum);
        this.renderPanel();
      },

      onRightThumbstickMoved: function (event) {
        if (!this.panelVisible || !this.enabled || !this.built) return;
        var y = Number(event.detail && event.detail.y) || 0;

        if (Math.abs(y) < 0.45) {
          this.thumbstickArmed = true;
          return;
        }

        var now = window.performance.now();
        if (!this.thumbstickArmed && now - this.lastScrollAt < 220) return;

        this.scrollBy(y > 0 ? -1 : 1);
        this.lastScrollAt = now;
        this.thumbstickArmed = false;
      },

      clearSelection: function (render) {
        this.selected.clear();
        this.helpers.forEach(function (helper) {
          if (helper.parent) helper.parent.remove(helper);
          if (helper.geometry) helper.geometry.dispose();
          if (helper.material) helper.material.dispose();
        });
        this.helpers.clear();
        if (render !== false) this.renderPanel();
      },

      setComponentVisibility: function (index, visible) {
        var node = this.treeNodes[index];
        if (!node) return;
        node.meshes.forEach(function (mesh) { mesh.visible = Boolean(visible); });
      },

      hideSelected: function () {
        var self = this;
        this.selected.forEach(function (index) { self.setComponentVisibility(index, false); });
        this.syncHelpers();
        this.renderPanel();
        this.refreshRaycaster();
      },

      showSelected: function () {
        var self = this;
        this.selected.forEach(function (index) { self.setComponentVisibility(index, true); });
        this.syncHelpers();
        this.renderPanel();
        this.refreshRaycaster();
      },

      isolateSelected: function () {
        if (this.selected.size === 0) return;
        var selectedMeshes = new Set();
        var self = this;

        this.selected.forEach(function (index) {
          var node = self.treeNodes[index];
          if (!node) return;
          node.meshes.forEach(function (mesh) { selectedMeshes.add(mesh); });
        });

        this.meshes.forEach(function (mesh) { mesh.visible = selectedMeshes.has(mesh); });
        this.syncHelpers();
        this.renderPanel();
        this.refreshRaycaster();
      },

      showAll: function () {
        this.meshes.forEach(function (mesh) { mesh.visible = true; });
        this.syncHelpers();
        this.renderPanel();
        this.refreshRaycaster();
      },

      toggleEdges: function () {
        this.edgesVisible = !this.edgesVisible;
        var root = this.asset && this.asset.getObject3D('mesh');
        MOJA.setEdgesVisible(root, this.edgesVisible);
        this.renderPanel();
      },

      nodeVisibilityState: function (node) {
        if (!node || node.meshes.length === 0) return node && node.suppressed ? 'suppressed' : 'empty';
        var visible = 0;
        node.meshes.forEach(function (mesh) { if (mesh.visible) visible += 1; });
        if (visible === 0) return 'hidden';
        if (visible === node.meshes.length) return 'visible';
        return 'mixed';
      },

      syncHelpers: function () {
        var self = this;

        Array.from(this.helpers.keys()).forEach(function (index) {
          if (!self.selected.has(index)) {
            var helper = self.helpers.get(index);
            if (helper.parent) helper.parent.remove(helper);
            if (helper.geometry) helper.geometry.dispose();
            if (helper.material) helper.material.dispose();
            self.helpers.delete(index);
          }
        });

        if (!this.enabled) {
          this.helpers.forEach(function (helper) { helper.visible = false; });
          return;
        }

        this.selected.forEach(function (index) {
          var node = self.treeNodes[index];
          if (!node) return;
          var visible = node.meshes.some(function (mesh) { return mesh.visible; });
          var helper = self.helpers.get(index);

          if (!helper) {
            helper = new THREE.Box3Helper(new THREE.Box3(), 0xa78bfa);
            helper.material.transparent = true;
            helper.material.opacity = 0.92;
            helper.material.depthTest = false;
            helper.renderOrder = 20;
            self.el.object3D.add(helper);
            self.helpers.set(index, helper);
          }

          helper.visible = visible;
        });
      },

      updateHelpers: function () {
        var self = this;

        this.helpers.forEach(function (helper, index) {
          if (!helper.visible) return;
          var node = self.treeNodes[index];
          if (!node) return;
          self.tempBox.makeEmpty();

          node.meshes.forEach(function (mesh) {
            if (!mesh.visible) return;
            self.tempBox.expandByObject(mesh);
          });

          if (!self.tempBox.isEmpty()) helper.box.copy(self.tempBox);
        });
      },

      updateScrollBar: function (rowCount) {
        if (!this.scrollTrack || !this.scrollThumb) return;
        var trackHeight = 0.49;
        var visibleRows = Math.max(1, this.data.rows);
        var ratio = Math.min(1, visibleRows / Math.max(1, rowCount));
        var thumbHeight = Math.max(0.055, trackHeight * ratio);
        var maximum = Math.max(0, rowCount - visibleRows);
        var progress = maximum > 0 ? this.scrollOffset / maximum : 0;
        var travel = trackHeight - thumbHeight;
        var y = travel * 0.5 - progress * travel;

        this.scrollThumb.setAttribute('height', thumbHeight);
        this.scrollThumb.object3D.position.set(0, y, 0.006);
        this.scrollTrack.object3D.visible = rowCount > visibleRows;
      },

      renderPanel: function () {
        if (!this.list || !this.header || !this.summary) return;
        while (this.list.firstChild) this.list.removeChild(this.list.firstChild);

        if (!this.built) {
          this.setLoadingText('WCZYTYWANIE DRZEWA…');
          this.updateScrollBar(0);
          return;
        }

        var rows = this.flattenTree();
        var maximum = Math.max(0, rows.length - this.data.rows);
        this.scrollOffset = MOJA.clamp(this.scrollOffset, 0, maximum);
        var start = this.scrollOffset;
        var end = Math.min(rows.length, start + this.data.rows);
        var visibleMeshCount = this.meshes.filter(function (mesh) { return mesh.visible; }).length;
        var sourceLabel = this.structureSource === 'IAM' ? 'IAM' : 'GLB';

        this.header.setAttribute('value', 'STRUKTURA / PART NUMBER');
        this.summary.setAttribute(
          'value',
          this.selected.size + ' zazn.  •  ' + visibleMeshCount + '/' + this.meshes.length + ' wid.  •  ' +
          (rows.length === 0 ? '0' : (start + 1) + '-' + end) + '/' + rows.length + '  •  ' + sourceLabel
        );

        for (var rowIndex = start; rowIndex < end; rowIndex += 1) {
          var nodeIndex = rows[rowIndex];
          var node = this.treeNodes[nodeIndex];
          if (!node) continue;

          var selected = this.selected.has(nodeIndex);
          var visibility = this.nodeVisibilityState(node);
          var y = -((rowIndex - start) * 0.064);
          var color = '#1E293B';
          var status = '●';

          if (selected) color = '#6D28D9';
          else if (visibility === 'hidden') color = '#3F3F46';
          else if (visibility === 'mixed') color = '#854D0E';
          else if (visibility === 'suppressed') color = '#4C0519';
          else if (visibility === 'empty') color = '#27272A';

          if (visibility === 'hidden') status = '○';
          else if (visibility === 'mixed') status = '◐';
          else if (visibility === 'suppressed') status = '×';
          else if (visibility === 'empty') status = '·';
          if (selected) status = '✓';

          var row = createElement('a-plane', {
            class: node.meshes.length > 0 ? 'component-ui ui-click' : '',
            width: 0.78,
            height: 0.057,
            color: color,
            position: '-0.025 ' + y + ' 0.012',
            material: 'shader: flat',
            'viewer-button': node.meshes.length > 0 ? ('action: component-toggle; value: ' + nodeIndex) : ''
          }, this.list);

          var indentation = Math.min(node.depth, 7) * 0.040;
          var hasChildren = node.children.length > 0;
          var textX = -0.355 + indentation + (hasChildren ? 0.052 : 0.020);

          if (hasChildren) {
            var expander = createElement('a-plane', {
              class: 'component-ui ui-click',
              width: 0.038,
              height: 0.044,
              color: node.expanded ? '#0F766E' : '#334155',
              position: (-0.365 + indentation) + ' ' + y + ' 0.020',
              material: 'shader: flat',
              'viewer-button': 'action: component-expand; value: ' + nodeIndex
            }, this.list);

            createElement('a-text', {
              value: node.expanded ? '−' : '+',
              align: 'center',
              anchor: 'center',
              width: 0.16,
              color: '#FFFFFF',
              position: '0 0 0.006'
            }, expander);
          }

          createElement('a-text', {
            value: status + ' ' + node.label,
            align: 'left',
            anchor: 'left',
            width: Math.max(0.36, 0.70 - indentation),
            'wrap-count': 34,
            color: node.suppressed ? '#FDA4AF' : '#F8FAFC',
            position: textX + ' 0 0.006'
          }, row);
        }

        this.updateScrollBar(rows.length);
        this.updatePanelInteractivity();
      },

      onUIAction: function (event) {
        var detail = event.detail || {};

        switch (detail.action) {
          case 'component-toggle': this.toggleIndex(Math.round(detail.value), false); break;
          case 'component-expand': this.toggleExpanded(Math.round(detail.value)); break;
          case 'component-hide': this.hideSelected(); break;
          case 'component-show': this.showSelected(); break;
          case 'component-isolate': this.isolateSelected(); break;
          case 'component-show-all': this.showAll(); break;
          case 'component-clear': this.clearSelection(); break;
          case 'component-scroll-up': this.scrollBy(-(this.data.rows - 1)); break;
          case 'component-scroll-down': this.scrollBy(this.data.rows - 1); break;
          case 'component-expand-all': this.expandAll(); break;
          case 'component-collapse-all': this.collapseAll(); break;
          case 'component-close': this.setPanelVisible(false); break;
          case 'component-edges': this.toggleEdges(); break;
        }
      },

      tick: function () {
        this.updateHelpers();
      },

      remove: function () {
        this.el.removeEventListener('model-normalized', this.onNormalized);
        this.el.removeEventListener('viewer-ui-action', this.onUIAction);
        if (this.right) this.right.removeEventListener('thumbstickmoved', this.onRightThumbstickMoved);
        this.clearSelection(false);
      }
    });


    AFRAME.registerComponent('mr-near-reticle', {
      schema: {
        camera: {type: 'selector'},
        placementDistance: {type: 'number', default: 1.25},
        maxDistance: {type: 'number', default: 1.8},
        minDistance: {type: 'number', default: 0.65}
      },
      init: function () {
        this.cameraWorld = new THREE.Vector3();
        this.hitWorld = new THREE.Vector3();
        this.adjustedWorld = new THREE.Vector3();
        this.horizontal = new THREE.Vector3();
      },
      tick: function () {
        if (window.QUEST_MODE !== 'mr' || !this.data.camera) return;
        var viewer = this.el.components['quest-viewer'];
        if (viewer && viewer.placed) return;

        var hitTest = this.el.components['ar-hit-test'];
        var reticleMesh = hitTest && hitTest.bboxMesh;
        if (!reticleMesh || !reticleMesh.visible) return;

        this.data.camera.object3D.getWorldPosition(this.cameraWorld);
        reticleMesh.getWorldPosition(this.hitWorld);
        this.horizontal.copy(this.hitWorld).sub(this.cameraWorld);
        this.horizontal.y = 0;

        var distance = this.horizontal.length();
        if (!Number.isFinite(distance) || distance < 0.0001) return;

        var desiredDistance = distance;
        if (distance > this.data.maxDistance) desiredDistance = this.data.placementDistance;
        else if (distance < this.data.minDistance) desiredDistance = this.data.minDistance;
        if (Math.abs(desiredDistance - distance) < 0.001) return;

        this.horizontal.multiplyScalar(desiredDistance / distance);
        this.adjustedWorld.copy(this.cameraWorld).add(this.horizontal);
        this.adjustedWorld.y = this.hitWorld.y;

        if (reticleMesh.parent) reticleMesh.parent.worldToLocal(this.adjustedWorld);
        reticleMesh.position.copy(this.adjustedWorld);
      }
    });
